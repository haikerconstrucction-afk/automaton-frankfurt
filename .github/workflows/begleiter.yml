name: begleiter
on:
  workflow_dispatch:
  push: {paths: ["worker/**"]}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Kein Cloudflare-Token - uebersprungen"; exit 0; fi
          cd worker
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json;print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='haiktec-begleiter'),''))")
          if [ -z "$ID" ]; then ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" -d '{"title":"haiktec-begleiter"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['id'])"); fi
          printf 'name = "haiktec-begleiter"\nmain = "index.js"\ncompatibility_date = "2026-01-01"\nworkers_dev = true\n[[kv_namespaces]]\nbinding = "KV"\nid = "%s"\n' "$ID" > wrangler.toml
          npx -y wrangler@4 deploy
          echo "${{ secrets.LLM_API_KEY }}" | npx -y wrangler@4 secret put LLM_API_KEY
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx -y wrangler@4 secret put STRIPE_SECRET_KEY
