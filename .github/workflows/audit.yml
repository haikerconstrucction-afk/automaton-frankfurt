name: audit
on:
  workflow_dispatch:
concurrency: {group: automaton, cancel-in-progress: false}
permissions: {issues: write, contents: write, pages: write, id-token: write}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q openpyxl reportlab pillow edge-tts pypdf && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg libreoffice-calc-nogui >/dev/null
      - run: python automaton/audit.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_USER_ID: ${{ secrets.ETSY_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: |
          git config user.name automaton && git config user.email automaton@users.noreply.github.com
          git add -A && git commit -m "Automaton-Lauf $(date -u +%F-%H%M)" || true
          git pull --rebase -X theirs || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
      - run: sleep 30 && python automaton/indexnow.py
