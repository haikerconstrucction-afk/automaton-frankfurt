<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>TikTok verbunden</title><link rel="stylesheet" href="style.css"><main class="wrap legalpage"><h1>TikTok-Freigabe</h1>
<p>Kopieren Sie diesen Code und schicken Sie ihn im Chat. Er ist nur wenige Minuten gültig.</p>
