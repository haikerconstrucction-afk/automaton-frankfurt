<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haiktec Portal</title><meta name="robots" content="noindex"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://haiktec-portal.haiktec.workers.dev; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><link rel="icon" href="../favicon.png">
<style>
:root{--g:#0b6e4f;--d:#0f1f19;--l:#f4f7f5;--m:#6b7a73;--b:#e3e9e6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--l);color:var(--d)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--b)}header img{width:30px}header b{flex:1}header small{color:var(--m)}
main{max-width:1100px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:1.1rem;margin:0 0 10px;color:var(--g)}label{display:block;font-size:.85rem;margin:8px 0 3px;color:var(--m)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd8d4;border-radius:9px;font:inherit}button{background:var(--g);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
button.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{margin:0}.tabs button.on{background:var(--d)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:600}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;background:#e7f3ee;color:var(--g)}.red{background:#fde8e6;color:#b03a2e}
.score{font-size:2.4rem;font-weight:800;color:var(--g)}pre{white-space:pre-wrap;background:var(--l);padding:12px;border-radius:9px;font:inherit}.muted{color:var(--m);font-size:.85rem}#login{max-width:420px;margin:60px auto}
</style></head><body>
<div style="background:#fff4d6;color:#6b4e00;padding:8px 20px;font-size:.85rem;text-align:center">Testbetrieb: Bitte keine echten Kundendaten eingeben. Das Portal wird vor dem Echtbetrieb extern sicherheitsgeprüft.</div><header><img src="../icon.png" alt=""><b>Haiktec Portal (Test)</b><small id="who"></small></header>
<main id="app"></main>
<script>
const API="https://haiktec-portal.haiktec.workers.dev";const $=s=>document.querySelector(s);let tok=sessionStorage.hp||"",me=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,m="GET",b){const r=await fetch(API+p,{method:m,headers:{"content-type":"application/json",...(tok?{authorization:"Bearer "+tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json();if(r.status==401&&p!="/auth/login"){tok="";sessionStorage.hp="";login();}if(!r.ok)throw new Error(j.error||"Fehler");return j}
const q=new URLSearchParams(location.search);
function accept(){ $("#app").innerHTML=`<div id="login" class="card"><h1>Zugang einrichten</h1><p class="muted">Legen Sie Ihr persönliches Passwort fest (mind. 10 Zeichen).</p><label>Passwort</label><input id="p1" type="password"><label>Passwort wiederholen</label><input id="p2" type="password"><label style="display:flex;gap:8px;align-items:center"><input id="t" type="checkbox" style="width:auto"> Ich akzeptiere <a href="../agb.html" target="_blank">AGB</a> und <a href="../datenschutz.html" target="_blank">Datenschutz</a>.</label><button id="go">Zugang aktivieren</button><p id="msg" class="muted"></p></div>`;
 $("#go").onclick=async()=>{if($("#p1").value!==$("#p2").value)return $("#msg").textContent="Passwörter stimmen nicht überein.";try{await api("/auth/accept","POST",{token:q.get("invite"),password:$("#p1").value,accept_terms:$("#t").checked});history.replaceState(0,"",location.pathname);$("#msg").textContent="Fertig. Bitte jetzt anmelden.";setTimeout(login,1200)}catch(e){$("#msg").textContent=e.message}}}
function login(){ $("#who").textContent="";$("#app").innerHTML=`<div id="login" class="card"><h1>Anmelden</h1><label>E-Mail</label><input id="e" type="email" autocomplete="username"><label>Passwort</label><input id="p" type="password" autocomplete="current-password"><button id="go">Anmelden</button><p id="msg" class="muted"></p><p class="muted">Zugang nur auf Einladung. Jeder Mandant sieht ausschließlich seine eigenen Daten.</p></div>`;
 const go=async()=>{try{const b={email:$("#e").value,password:$("#p").value};if($("#c"))b.code=$("#c").value;const r=await api("/auth/login","POST",b);
  if(r.need2fa){if(!$("#c")){$("#p").insertAdjacentHTML("afterend",'<label>6-stelliger Code aus der Authenticator-App</label><input id="c" inputmode="numeric" autocomplete="one-time-code">');$("#c").focus();$("#c").onkeydown=e=>e.key=="Enter"&&go()}$("#msg").textContent="Bitte Code eingeben.";return}
  tok=r.token;sessionStorage.hp=tok;start()}catch(e){$("#msg").textContent=e.message}};$("#go").onclick=go;$("#p").onkeydown=e=>e.key=="Enter"&&go()}
async function setup2fa(){ const r=await api("/auth/2fa/setup","POST",{});$("#app").innerHTML=`<div id="login" class="card"><h1>Zwei-Faktor-Anmeldung einrichten</h1><p class="muted">Pflicht für Administratoren. Installieren Sie eine Authenticator-App (z. B. Google Authenticator, Microsoft Authenticator), wählen Sie „Schlüssel eingeben“ und tragen Sie diesen Schlüssel ein:</p><pre style="font-size:1.1rem;letter-spacing:2px">${esc(r.secret.match(/.{1,4}/g).join(" "))}</pre><p class="muted">Konto: Haiktec · Zeitbasiert</p><label>Angezeigter 6-stelliger Code</label><input id="c" inputmode="numeric"><button id="ok">Aktivieren</button><p id="msg" class="muted"></p></div>`;
 $("#ok").onclick=async()=>{try{await api("/auth/2fa/enable","POST",{code:$("#c").value});start()}catch(e){$("#msg").textContent=e.message}}}
async function start(){ me=await api("/me"); if(me.need2fa_setup) return setup2fa(); document.documentElement.lang=me.tenant.lang||"de";$("#who").innerHTML=`${esc(me.tenant.name)} · ${esc(me.email)} · <a href="#" id="lo">Abmelden</a>`;$("#lo").onclick=async e=>{e.preventDefault();await api("/auth/logout","POST",{});tok="";sessionStorage.hp="";login()};
 const tabs=[["geo","KI-Sichtbarkeit"],["mahn","Mahnwesen"],["aufgaben","Aufgaben"]].filter(t=>t[0]=="aufgaben"||me.tenant.modules.includes(t[0]));
 if(["admin","superadmin"].includes(me.role))tabs.push(["team","Team & Protokoll"]);if(me.role=="superadmin")tabs.push(["super","Mandanten"]);
 $("#app").innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="ghost" data-t="${t[0]}">${t[1]}</button>`).join("")}</div><div id="view"></div>`;
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");V[b.dataset.t]()});document.querySelector(".tabs button").click()}
const V={
 async geo(){ $("#view").innerHTML=`<div class="card"><h2>KI-Sichtbarkeits-Check</h2><p class="muted">Wir fragen eine KI-Suchmaschine so, wie Ihre Kunden fragen würden, und prüfen, ob Ihre Firma genannt wird.</p><div class="row"><div><label>Firma</label><input id="f"></div><div><label>Branche</label><input id="br" placeholder="z. B. Steuerberater"></div><div><label>Ort</label><input id="o"></div><div><label>Website</label><input id="w" placeholder="beispiel.de"></div><div><label>Sprache</label><select id="lg">${["de","en","es","fr","zh"].map(l=>`<option ${l==(me.tenant.lang||"de")?"selected":""}>${l}</option>`).join("")}</select></div></div><button id="run">Analyse starten</button><p id="msg" class="muted"></p></div><div id="rep"></div><div class="card"><h2>Frühere Berichte</h2><div id="old">...</div></div>`;
  const show=r=>{$("#rep").innerHTML=`<div class="card"><h2>${esc(r.firma)} – ${new Date(r.t).toLocaleString("de-DE")}</h2><div class="score">${r.score} %</div><p class="muted">Anteil der KI-Antworten, in denen Ihre Firma genannt wurde.</p><table><tr><th>Kundenfrage</th><th>Genannt</th></tr>${r.res.map(x=>`<tr><td>${esc(x.frage)}</td><td><span class="pill ${x.genannt?"":"red"}">${x.genannt?"ja":"nein"}</span></td></tr>`).join("")}</table><h2 style="margin-top:16px">Empfehlungen</h2><pre>${esc(r.tipps)}</pre><button class="ghost" onclick="print()">Als PDF drucken</button></div>`};
  $("#run").onclick=async()=>{$("#msg").textContent="Läuft, ca. 30–60 Sekunden ...";try{show(await api("/geo/run","POST",{firma:$("#f").value,branche:$("#br").value,ort:$("#o").value,website:$("#w").value,lang:$("#lg").value}));$("#msg").textContent=""}catch(e){$("#msg").textContent=e.message}};
  const old=await api("/geo/reports");$("#old").innerHTML=old.length?`<table>${old.map((r,i)=>`<tr><td>${esc(r.firma)}</td><td>${new Date(r.t).toLocaleDateString("de-DE")}</td><td>${r.score} %</td><td><a href="#" data-i="${i}">öffnen</a></td></tr>`).join("")}</table>`:"<p class='muted'>Noch keine Berichte.</p>";document.querySelectorAll("#old a").forEach(a=>a.onclick=e=>{e.preventDefault();show(old[a.dataset.i])})},
 async mahn(){ const inv=await api("/mahn/invoices");const today=new Date().toISOString().slice(0,10);
  $("#view").innerHTML=`<div class="card"><h2>Offene Rechnungen</h2><table><tr><th>Kunde</th><th>Nr.</th><th>Betrag</th><th>Fällig</th><th>Status</th><th></th></tr>${inv.map(i=>`<tr><td>${esc(i.kunde)}</td><td>${esc(i.nr)}</td><td>${(+i.betrag).toFixed(2)} €</td><td>${esc(i.faellig)} ${i.status!="bezahlt"&&i.faellig<today?'<span class="pill red">überfällig</span>':""}</td><td>${esc(i.status)}</td><td><a href="#" data-l="${i.id}">Schreiben erstellen</a> · <a href="#" data-p="${i.id}">bezahlt</a></td></tr>`).join("")||"<tr><td colspan=6 class='muted'>Keine Rechnungen erfasst.</td></tr>"}</table></div>
  <div class="card"><h2>Rechnung erfassen</h2><div class="row"><div><label>Kunde</label><input id="k"></div><div><label>Rechnungsnr.</label><input id="n"></div><div><label>Betrag (€)</label><input id="b" type="number" step="0.01"></div><div><label>Fällig am</label><input id="d" type="date"></div></div><button id="add">Speichern</button></div><div id="out"></div>
  <p class="muted">Das Mahnwesen ist ein Werkzeug für Ihre eigenen Forderungen, in Ihrem Namen. Haiktec treibt keine Forderungen für Dritte ein und leistet keine Rechtsberatung.</p>`;
  $("#add").onclick=async()=>{await api("/mahn/invoices","POST",{kunde:$("#k").value,nr:$("#n").value,betrag:$("#b").value,faellig:$("#d").value});V.mahn()};
  document.querySelectorAll("[data-p]").forEach(a=>a.onclick=async e=>{e.preventDefault();const i=inv.find(x=>x.id==a.dataset.p);await api("/mahn/invoices","POST",{...i,status:"bezahlt"});V.mahn()});
  document.querySelectorAll("[data-l]").forEach(a=>a.onclick=async e=>{e.preventDefault();$("#out").innerHTML="<div class='card muted'>Wird erstellt ...</div>";const i=inv.find(x=>x.id==a.dataset.l);const st=i.status=="gemahnt"?1:0;const r=await api("/mahn/letter","POST",{id:i.id,stufe:st,lang:me.tenant.lang||"de"});await api("/mahn/invoices","POST",{...i,status:"gemahnt"});$("#out").innerHTML=`<div class="card"><h2>${esc(r.stufe)}</h2><pre>${esc(r.text)}</pre><button class="ghost" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent)">Kopieren</button></div>`})},
 async aufgaben(){ const t=await api("/aufgaben");$("#view").innerHTML=`<div class="card"><h2>Aufgaben</h2><table><tr><th>Aufgabe</th><th>Frist</th><th>Zuständig</th><th></th></tr>${t.map(a=>`<tr><td>${a.erledigt?"<s>":""}${esc(a.titel)}${a.erledigt?"</s>":""}</td><td>${esc(a.frist)}</td><td>${esc(a.wer)}</td><td><a href="#" data-d="${a.id}">${a.erledigt?"wieder öffnen":"erledigt"}</a></td></tr>`).join("")||"<tr><td colspan=4 class='muted'>Keine Aufgaben.</td></tr>"}</table><div class="row"><div><label>Aufgabe</label><input id="ti"></div><div><label>Frist</label><input id="fr" type="date"></div><div><label>Zuständig</label><input id="we"></div></div><button id="add">Hinzufügen</button></div>`;
  $("#add").onclick=async()=>{await api("/aufgaben","POST",{titel:$("#ti").value,frist:$("#fr").value,wer:$("#we").value});V.aufgaben()};
  document.querySelectorAll("[data-d]").forEach(a=>a.onclick=async e=>{e.preventDefault();const x=t.find(y=>y.id==a.dataset.d);await api("/aufgaben","POST",{...x,erledigt:!x.erledigt});V.aufgaben()})},
 async team(){ const log=await api("/audit");$("#view").innerHTML=`<div class="card"><h2>Mitarbeiter einladen</h2><div class="row"><div><label>Name</label><input id="nm"></div><div><label>E-Mail</label><input id="em"></div><div><label>Rolle</label><select id="ro"><option value="user">Mitarbeiter</option><option value="admin">Administrator</option></select></div></div><button id="inv">Einladungslink erstellen</button><p id="msg" class="muted"></p></div><div class="card"><h2>Protokoll</h2><table>${log.map(l=>`<tr><td>${new Date(l.t).toLocaleString("de-DE")}</td><td>${esc(l.who)}</td><td>${esc(l.what)}</td></tr>`).join("")}</table></div>`;
  $("#inv").onclick=async()=>{try{const r=await api("/invite","POST",{name:$("#nm").value,email:$("#em").value,role:$("#ro").value});$("#msg").innerHTML=`Link (7 Tage gültig, bitte persönlich weitergeben):<br><input value="${esc(r.invite)}" onclick="this.select()">`}catch(e){$("#msg").textContent=e.message}}},
 async super(){ const ts=await api("/super/tenants");$("#view").innerHTML=`<div class="card"><h2>Mandanten</h2><table><tr><th>Name</th><th>Branche</th><th>Sprache / Länder</th><th>Module</th><th>Tarif</th><th></th></tr>${ts.filter(Boolean).map(t=>`<tr><td>${esc(t.name)} ${t.locked?'<span class="pill red">gesperrt</span>':""}</td><td>${esc(t.branche)}</td><td>${esc(t.lang||"de")} / ${esc((t.countries||[]).join(" ")||"alle")}</td><td>${esc(t.modules.join(", "))}</td><td>${esc(t.plan||"")}</td><td><a href="#" data-t="${t.id}">Admin einladen</a> · <a href="#" data-lk="${t.id}" data-v="${t.locked?0:1}">${t.locked?"entsperren":"sperren"}</a></td></tr>`).join("")||"<tr><td colspan=5 class='muted'>Noch keine Kunden.</td></tr>"}</table></div>
  <div class="card"><h2>Neuen Mandanten anlegen</h2><div class="row"><div><label>Firmenname</label><input id="n"></div><div><label>Branche</label><select id="b"><option>Steuerbüro</option><option>Immobilien / Hausverwaltung</option><option>Handwerk</option><option>Sonstige</option></select></div><div><label>Sprache</label><select id="lg"><option value="de">Deutsch</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="zh">中文</option></select></div><div><label>Erlaubte Länder (z. B. DE AT CH, leer = alle)</label><input id="cc" placeholder="DE"></div><div><label>Tarif</label><select id="p"><option>GEO-Check 500 €</option><option>Betreuung 75 €/Std.</option><option>Portal Basis</option></select></div></div><label>Module</label><p><label style="display:inline"><input type="checkbox" value="geo" checked style="width:auto"> KI-Sichtbarkeit</label> <label style="display:inline"><input type="checkbox" value="mahn" checked style="width:auto"> Mahnwesen</label></p><button id="add">Anlegen</button><p id="msg" class="muted"></p></div>`;
  $("#add").onclick=async()=>{const m=[...document.querySelectorAll("#view input[type=checkbox]:checked")].map(x=>x.value);await api("/super/tenants","POST",{name:$("#n").value,branche:$("#b").value,plan:$("#p").value,modules:m,lang:$("#lg").value,countries:$("#cc").value});V.super()};
  document.querySelectorAll("[data-lk]").forEach(a=>a.onclick=async e=>{e.preventDefault();if(!confirm("Wirklich ändern?"))return;await api("/super/lock","POST",{tid:a.dataset.lk,locked:a.dataset.v=="1"});V.super()});
  document.querySelectorAll("[data-t]").forEach(a=>a.onclick=async e=>{e.preventDefault();const em=prompt("E-Mail des Kunden-Admins:");if(!em)return;try{const r=await api("/invite","POST",{tid:a.dataset.t,email:em,role:"admin"});prompt("Einladungslink (7 Tage gültig):",r.invite)}catch(x){alert(x.message)}})}
};
if(API.startsWith("__")) $("#app").innerHTML="<div class='card'>Portal wird eingerichtet.</div>"; else if(q.get("invite")) accept(); else if(tok) start().catch(login); else login();
</script></body></html>
